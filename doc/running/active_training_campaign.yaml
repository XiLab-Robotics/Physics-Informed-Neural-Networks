notes: >
  Preparation found that the legacy Stage 3 exact PF-A replay used measured
  operating averages despite the declared setpoint-only scope. Stage 4
  preserves that artifact for provenance but uses a new training-only causal
  setpoint PF-A refit. The deterministic implementation preflight passes all
  thirteen internal gates. Local and remote-compatible launcher preflights
  pass, and all eighteen real-dataset one-batch validation checks completed
  without failures. The first launch attempt stopped before training because
  the central campaign runner lacked the new model-type dispatch entry. The
  dispatch map and deterministic validator were corrected, the failed queue
  was preserved under an explicit archive name, and the clean retry started
  locally in the background. The retry completed all eighteen runs without a
  failure. H08 was the scalar campaign winner, but all eight primary hybrids
  failed the bounded curve-first and cancellation gates. No residual
  architecture was promoted, no stability repeats were required, and the
  official TE Curve Verification Pipeline decision remains unchanged.
