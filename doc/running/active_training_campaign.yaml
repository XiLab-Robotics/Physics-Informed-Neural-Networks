notes: >
  The parent twelve-arm campaign completed without failures. Its bounded
  curve-first comparison retained only C1-Fw for the campaign-plan stability
  gate because it improved raw error, offset error, centered-shape error,
  harmonic-amplitude error, and phase error over C0-Fw, despite a material
  peak-to-peak regression. Both reproducibly seeded repeats completed without
  queue failures. Seed 314159 reached test MAE 0.00147247 deg and seed 271828
  reached 0.00189774 deg. The full-curve audit found stable bounded stiffness
  with 2.48 percent population CV, but only two of three C1-Fw
  initializations passed the joint curve-first gate. Phase 3 is closed as a
  valid negative result with no promoted compliance residual and no accepted
  reference change.
