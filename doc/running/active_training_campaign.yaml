  On 2026-07-17, fw and bw were submitted as independent manifest-validated queue runs to execute in parallel with the already-running global job.
  On 2026-07-17, a global-only ulow backup was submitted because the original global job was still in GBM after 17h43m on a 24h high allocation.
  The original high-partition global job 136143 timed out during LGBM and is not a valid completed global surface.
  On 2026-07-19, accepted final jobs 136266, 136267, and 136268 completed and were promoted into the official actual_values archive.
