name: Publish Sphinx Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sphinx-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # This check only needs authored docs, helper scripts and portal assets.
      # The 24+ GB scientific archive (datasets, training outputs, ONNX, videos,
      # PDFs, checkpoints and source references) stays in Git, but is not
      # materialized on this disposable documentation runner.
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /README.md
            /AGENTS.md
            /.markdownlint-cli2.jsonc
            /site/
            /scripts/
            /config/
            /models/**/*.md
            /doc/**/*.md
            /doc/**/*.png
            /doc/**/*.svg
            /doc/**/*.yaml
            /doc/**/*.json
          sparse-checkout-cone-mode: false

      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10,<3.0"
          python -m pip install -r site/requirements-docs.txt

      - name: Build Sphinx Site
        run: python -m sphinx -W -b html site site/_build/html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
