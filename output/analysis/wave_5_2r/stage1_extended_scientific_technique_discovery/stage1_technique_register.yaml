contract:
  dataset_id: polished_dataset
  input_mode: setpoints
  surface: Fw
  split_signature: c1aa8718fb9bf88cc2021c121dc4f3b4010fc1d2e45ac90af5f4376aa64f8e16
  runtime_variable_allowlist:
    - theta
    - speed_setpoint
