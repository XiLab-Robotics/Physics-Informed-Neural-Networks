candidate_formulations:
  - {formulation_id: INT-1, name: periodic plus compliance, feasibility_class: blocked_by_data_contract, full_pinn_eligible: false, reason: Both tested physical constraints failed promotion.}
  - {formulation_id: INT-2, name: periodic plus hysteresis, feasibility_class: blocked_by_data_contract, full_pinn_eligible: false, reason: Periodic constraint was rejected and hysteresis lacks repeated loops.}
  - {formulation_id: INT-3, name: periodic plus dynamic state, feasibility_class: blocked_by_data_contract, full_pinn_eligible: false, reason: Periodic constraint was rejected and dynamic inertia is unidentifiable.}
  - {formulation_id: INT-4, name: periodic plus bidirectional compatibility, feasibility_class: blocked_by_data_contract, full_pinn_eligible: false, reason: Neither isolated physical component passed promotion.}
  - {formulation_id: INT-5, name: compliance plus hysteresis, feasibility_class: blocked_by_data_contract, full_pinn_eligible: false, reason: Compliance was rejected and hysteresis is not trainable locally.}
  - {formulation_id: INT-6, name: reduced contact plus dynamic state, feasibility_class: synthetic_oracle_only, full_pinn_eligible: false, reason: Contact is synthetic and dynamic state lacks identifiable excitation.}
  - {formulation_id: INT-7, name: uncertainty around validated physics, feasibility_class: blocked_by_data_contract, full_pinn_eligible: false, reason: No validated physical component exists to wrap.}
  - {formulation_id: INT-8, name: wear or electromechanical auxiliary heads, feasibility_class: synthetic_oracle_only, full_pinn_eligible: false, reason: Both branches require unavailable longitudinal or electrical datasets.}
decision:
  status: failed_no_training_authorized
  summary: >-
    Integrated multi-physics training is not authorized because zero promoted
    physical components are available against a minimum requirement of two.
  key_findings:
    - The authoritative Phase 13 roster contains zero eligible physical components.
    - Loss and identifiability interactions cannot be tested without a valid pair.
    - Empirical, rejected, and synthetic mechanisms are not integration-ready physics.
    - The integration sequence remains preserved with explicit reopening conditions.
  physical_residual_promoted: false
  campaign_preparation_required: false
  advance_to_next_phase: true
  next_phase_number: 15
  next_phase_title: Wave 6 Entry
