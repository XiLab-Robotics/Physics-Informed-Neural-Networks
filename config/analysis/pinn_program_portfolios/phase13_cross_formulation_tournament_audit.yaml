candidate_formulations:
  - {formulation_id: TOUR-P1, name: Polynomial-Fourier semi-analytical benchmark, feasibility_class: real_data_trainable, full_pinn_eligible: false, reason: Benchmark is useful but not a governing-law PINN.}
  - {formulation_id: TOUR-P2, name: Harmonic and kinematic constraints, feasibility_class: offline_oracle_only, full_pinn_eligible: false, reason: Tested constraints failed curve-first promotion.}
  - {formulation_id: TOUR-P3, name: Quasi-static compliance constraints, feasibility_class: offline_oracle_only, full_pinn_eligible: false, reason: Compliance residual failed repeatability and joint gates.}
  - {formulation_id: TOUR-P4, name: Hysteresis and memory, feasibility_class: offline_oracle_only, full_pinn_eligible: false, reason: Current data support reversal comparison but not repeated-loop training.}
  - {formulation_id: TOUR-P5, name: Bidirectional and lost-motion models, feasibility_class: real_data_trainable, full_pinn_eligible: false, reason: Empirical paired comparator exists without identifiable physical state.}
  - {formulation_id: TOUR-P6, name: Dynamic trajectory models, feasibility_class: real_data_trainable, full_pinn_eligible: false, reason: Empirical dynamic comparator exists without identifiable inertia residual.}
  - {formulation_id: TOUR-P7, name: Contact and stiffness models, feasibility_class: synthetic_oracle_only, full_pinn_eligible: false, reason: Contact states and parameters are unavailable.}
  - {formulation_id: TOUR-P8, name: Energy and efficiency models, feasibility_class: synthetic_oracle_only, full_pinn_eligible: false, reason: Input power and internal loss are unavailable.}
  - {formulation_id: TOUR-P9, name: Geometry and MMT models, feasibility_class: synthetic_oracle_only, full_pinn_eligible: false, reason: Unit metrology and causal MMT parameters are unavailable.}
  - {formulation_id: TOUR-P10, name: Wear and degradation models, feasibility_class: synthetic_oracle_only, full_pinn_eligible: false, reason: Longitudinal lifecycle evidence is unavailable.}
  - {formulation_id: TOUR-P11, name: Electromechanical coupling models, feasibility_class: synthetic_oracle_only, full_pinn_eligible: false, reason: Synchronized electrical evidence is unavailable.}
  - {formulation_id: TOUR-P12, name: Hybrid analytical and learned residuals, feasibility_class: real_data_trainable, full_pinn_eligible: false, reason: Empirical hybrids contain no promoted physical residual.}
decision:
  status: failed_no_training_authorized
  summary: >-
    The Phase 13 roster contains zero isolated full-PINN-eligible candidates,
    so the correct tournament result is no contest and no training campaign.
  key_findings:
    - All thirteen phase-evidence files exist.
    - Zero isolated formulations passed the full-PINN entry gate.
    - Semi-analytical and empirical candidates remain valid reference branches.
    - Rejected, offline, synthetic, deferred, and blocked mechanisms were not ranked as winners.
  physical_residual_promoted: false
  campaign_preparation_required: false
  advance_to_next_phase: true
  next_phase_number: 14
  next_phase_title: Integrated Multi-Physics PINNs
