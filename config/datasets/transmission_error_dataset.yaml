paths:
  dataset_root: data/polished_dataset
  dataset_roots:
    polished_dataset: data/polished_dataset
    simplified_dataset: data/simplified_dataset

dataset:
  name: polished_dataset
  reduction_ratio: 81.0
  angular_window_deg:
    minimum: 0.0
    maximum: 360.0

directions:
  use_forward_direction: true
  use_backward_direction: true

split:
  validation_split: 0.2
  test_split: 0.1
  random_seed: 42

dataloader:
  batch_size: 8
  num_workers: 0
