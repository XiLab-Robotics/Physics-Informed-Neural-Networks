paths:
  dataset_config_path: config/datasets/transmission_error_dataset.yaml
  exact_onnx_reference_root: ''
  output_root: output/validation_checks/rcim_model_bank_reproduction_polished_dataset
experiment:
  run_name: rcim_model_bank_reproduction_polished_dataset_bw
  model_family: rcim_model_bank_reproduction
  model_type: exact_model_bank_backward
data:
  direction_label: backward
  input_feature_names:
  - rpm
  - deg
  - tor
evaluation:
  selected_harmonics:
  - 0
  - 1
  - 3
  - 39
  - 40
  - 78
  - 81
  - 156
  - 162
  - 240
  decomposition_point_stride: 1
target_scope:
  mode: all
  include_phase_zero: false
training:
  enabled_families:
  - SVR
  - MLP
  - RF
  - DT
  - ET
  - ERT
  - GBM
  - HGBM
  - XGBM
  - LGBM
  validation_split: 0.2
  test_size: 0.1
  random_seed: 42
  deterministic: true
  threadpool_limit: 1
  joblib_cpu_limit: 0
  grid_search_disabled_families:
  - SVR
  hyperparameter_search:
    mode: paper_reference_grid_search
    grid_search_n_jobs: -1
    grid_search_verbose: 1
    grid_search_pre_dispatch: 2*n_jobs
export:
  enable_onnx_export: true
  target_opset: 12
  export_failure_mode: continue
  enable_empty_svr_constant_surrogate: true
dataset:
  name: polished_dataset
metadata:
  campaign_name: polished_dataset_rcim_model_bank_reproduction_2026_06_22
  planning_report_path: doc/reports/campaign_plans/cross_wave/polished_dataset/2026-06-22-22-55-55_polished_rcim_model_bank_reproduction_campaign_plan_report.md
  technical_document_path: doc/technical/2026-06/2026-06-22/2026-06-22-22-55-55_polished_rcim_and_full_wave_retraining_campaigns.md
  dataset_schema: polished_point_v1
  campaign_config_id: rcim_model_bank_reproduction_bw
  training_variant: bw
  direction_scope_label: backward_only
  use_forward_direction: false
  use_backward_direction: true
