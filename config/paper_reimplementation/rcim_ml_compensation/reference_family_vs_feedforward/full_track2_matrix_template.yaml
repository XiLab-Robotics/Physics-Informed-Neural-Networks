          candidate_surface: Bw
          archive_root: models/paper_reference/rcim_track1/backward
          allowed_direction_list:
            - backward
          amplitude_family_by_harmonic:
            "0": LGBM
            "1": ERT
            "3": GBM
            "39": LGBM
            "40": RF
            "78": LGBM
            "81": ERT
            "156": ERT
            "162": LGBM
            "240": LGBM
          phase_family_by_harmonic:
            "1": RF
            "3": LGBM
            "39": DT
            "40": ERT
            "78": LGBM
            "81": LGBM
            "156": ERT
            "162": DT
            "240": DT
    wave1_exported_models:
      exported_model_root: models/exported
      base_family_list:
        - feedforward
        - harmonic_regression
        - periodic_mlp
        - residual_harmonic_mlp
        - tree
