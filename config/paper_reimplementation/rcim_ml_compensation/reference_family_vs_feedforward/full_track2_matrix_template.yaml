paths:
  dataset_config_path: config/datasets/transmission_error_dataset.yaml
experiment:
  run_name: track2_full_directional_family_matrix
  model_family: track2_reference_comparison
  model_type: reference_family_vs_feedforward
comparison:
  comparison_mode: full_directional_candidate_matrix
  canonical_report_path: doc/reports/analysis/Track 2 Directional Model Comparison.md
  percentage_error_denominator: peak_to_peak_truth
  preview_curve_count: 8
  report_plot_root: doc/reports/campaign_results/track 2
  candidate_generation:
    track1_reference_banks:
      forward_archive_root: models/paper_reference/rcim_track1/forward
      backward_archive_root: models/paper_reference/rcim_track1/backward
      family_list: &paper_reference_family_list
        - family_id: SVM
          family_label: SVM
          archive_folder: svm_reference_models
        - family_id: MLP
          family_label: MLP
          archive_folder: mlp_reference_models
        - family_id: RF
          family_label: RF
          archive_folder: rf_reference_models
        - family_id: DT
          family_label: DT
          archive_folder: dt_reference_models
        - family_id: ET
          family_label: ET
          archive_folder: et_reference_models
        - family_id: ERT
          family_label: ERT
          archive_folder: ert_reference_models
        - family_id: GBM
          family_label: GBM
          archive_folder: gbm_reference_models
        - family_id: HGBM
          family_label: HGBM
          archive_folder: hgbm_reference_models
        - family_id: XGBM
          family_label: XGBM
          archive_folder: xgbm_reference_models
        - family_id: LGBM
          family_label: LGBM
          archive_folder: lgbm_reference_models
        - family_id: ELM
          family_label: ELM
          archive_folder: elm_reference_models
    paper_reference_archive_groups:
      - source_label: rcim_original
        direction_list:
          - direction_label: forward
            candidate_surface: Fw
            archive_root: models/paper_reference/rcim_original/forward
        family_list: *paper_reference_family_list
      - source_label: rcim_retuned
        direction_list:
          - direction_label: forward
            candidate_surface: Fw
            archive_root: models/paper_reference/rcim_retuned/forward
          - direction_label: backward
            candidate_surface: Bw
            archive_root: models/paper_reference/rcim_retuned/backward
        family_list: *paper_reference_family_list
    wave1_exported_models:
      exported_model_root: models/exported
      base_family_list:
        - feedforward
        - harmonic_regression
        - periodic_mlp
        - residual_harmonic_mlp
        - tree
evaluation:
  selected_harmonics:
    - 0
    - 1
    - 3
    - 39
    - 40
    - 78
    - 81
    - 156
    - 162
    - 240
  decomposition_point_stride: 1
