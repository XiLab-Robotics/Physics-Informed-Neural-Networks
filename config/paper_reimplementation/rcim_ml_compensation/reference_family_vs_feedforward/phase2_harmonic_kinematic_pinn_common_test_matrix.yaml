    candidate_surface: Fw
    family_registry_path: output/training_campaigns/2026-07-26-14-03-44_phase2_harmonic_kinematic_pinn_runtime_bounded_restart_2026_07_26/candidate_registries/h0_fourier_control_fw.yaml
