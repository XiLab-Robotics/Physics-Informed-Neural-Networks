paths:
  dataset_config_path: config/training/track2h_latent_state_hysteresis/campaigns/2026-06-16_track2h_latent_state_hysteresis_campaign/dataset_variants/transmission_error_dataset_fw.yaml
  output_root: output/training_runs/track2h_latent_state_hysteresis_gru_offset_residual_fw
experiment:
  run_name: te_track2h_l_gru_offset_residual_fw
  model_family: track2h_latent_state_hysteresis_gru_offset_residual_fw
  model_type: latent_state_hysteresis_probe
metadata:
  campaign_name: track2h_latent_state_hysteresis_campaign_2026_06_16
  planning_report_path: doc/reports/campaign_plans/track2/2026-06-16-16-00-57_track2h_latent_state_hysteresis_campaign_plan_report.md
  technical_document_path: doc/technical/2026-06/2026-06-16/2026-06-16-16-00-57_track2h_latent_state_hysteresis_package.md
  phase_name: track2h_latent_state_hysteresis
  campaign_config_id: track2h_latent_state_hysteresis_gru_offset_residual_fw
  queue_index: 2
  intervention: latent_state_hysteresis_probe
  probe_group: latent_state_hysteresis
  loss_profile: gru_offset_residual
  latent_encoder_type: gru
  training_variant: Fw
  direction_scope_label: forward_only
  use_forward_direction: true
  use_backward_direction: false
  runtime_input_contract: current point state plus previous operating-state samples only
  causal_window_contract: sequence_target_position=last and readout_position=last; no future samples are used
  forbidden_inputs: measured TE, curve mean, held-out full-curve statistics, future samples, post-prediction centering
  promotion_rule: Candidate must return through normal closeout and separate official Track 2 curve-first verification.
  baseline_control: Completed Track 2H robust/probabilistic/MDN probes plus Wave 3 harmonic-prior residual
  notes: Compact causal GRU hidden state over previous operating-state samples.
dataset:
  curve_batch_size: 2
  point_stride: 1
  maximum_points_per_curve: null
  collate_mode: sequence
  sequence_length: 33
  sequence_stride: 4
  sequence_target_position: last
  maximum_sequences_per_curve: 192
  shuffle_training_batch_elements: false
  num_workers: 8
  pin_memory: true
model:
  input_size: 5
  output_size: 1
  latent_encoder_type: gru
  latent_hidden_size: 96
  latent_num_layers: 2
  latent_dropout_probability: 0.1
  latent_channel_size: null
  latent_kernel_size: 5
  latent_activation_name: GELU
  readout_position: last
  base_hidden_size:
  - 96
  - 64
  head_hidden_size:
  - 96
  - 64
  head_activation_name: GELU
  head_dropout_probability: 0.05
  use_layer_norm: true
  offset_scale: 1.0
  residual_scale: 1.0
training:
  learning_rate: 0.0005
  weight_decay: 0.0001
  min_epochs: 20
  max_epochs: 260
  patience: 40
  min_delta: 1.0e-05
  log_every_n_steps: 1
  fast_dev_run: false
  deterministic: false
  loss:
    profile: gru_offset_residual
    pointwise_loss: smooth_l1
    huber_delta: 0.75
    weights:
      point: 1.0
      centered: 0.2
      offset: 0.2
      amplitude: 0.05
      harmonic: 0.0
    harmonic_index_list: []
runtime:
  accelerator: auto
  devices: auto
  precision: '32'
  benchmark: true
  use_non_blocking_transfer: true
